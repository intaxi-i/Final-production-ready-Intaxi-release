name: Apply city router extraction

on:
  push:
    branches: [recovery/city-router]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/city-router
          fetch-depth: 0

      - name: Extract city routes from api/main.py
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('api/main.py')
          s = main_path.read_text(encoding='utf-8')

          start_marker = "@app.get('/city/tariffs', response_model=TariffListResponse)"
          end_marker = "@app.get('/chat/{trip_id}/messages', response_model=ChatMessageListResponse)"
          if start_marker not in s:
              raise SystemExit('city block start marker not found')
          if end_marker not in s:
              raise SystemExit('city block end marker not found')
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          city_block = s[start:end].rstrip() + '\n'

          header = '''from __future__ import annotations

from fastapi import APIRouter, Depends, HTTPException, Query
from sqlalchemy import or_, select

from api.auth import get_current_user
from api.schemas import (
    CityAcceptResponse,
    CityOrderCreateRequest,
    CityOrderCreateResponse,
    CityOrderEnvelope,
    CityOrderListResponse,
    CityOrderResponse,
    CityTripEnvelope,
    CityTripStatusUpdateRequest,
    CurrentTripResponse,
    RaisePriceRequest,
    TariffItem,
    TariffListResponse,
)
from intaxi_bot.app.database.models import (
    CityOrderRuntime,
    CityOrderV1,
    CityTripV1,
    IntercityRequestV1,
    IntercityRouteMeta,
    IntercityRouteV1,
    TariffSetting,
    User,
    Vehicle,
    async_session,
    utcnow,
)
from api.main import (
    DEFAULT_TARIFFS,
    _city_order_to_schema,
    _city_trip_to_schema,
    _dispatch_stage_and_seen,
    _ensure_online_state,
    _map_urls,
    _recommended_price,
    _require_verified_driver,
    _send_driver_card_to_passenger,
)

router = APIRouter(tags=['city'])
app = router

'''
          city_path = Path('api/routers/city.py')
          city_path.write_text(header + city_block.replace('@app.', '@router.'), encoding='utf-8')

          if 'from api.routers import city as city_router\n' not in s:
              s = s.replace(
                  'from api.routers import driver as driver_router\n',
                  'from api.routers import city as city_router\nfrom api.routers import driver as driver_router\n',
              )
          if 'app.include_router(city_router.router)\n' not in s:
              s = s.replace(
                  'app.include_router(driver_router.router)\n',
                  'app.include_router(driver_router.router)\napp.include_router(city_router.router)\n',
              )

          s = s[:start] + s[end:]
          for forbidden in [
              "@app.get('/city/tariffs'",
              "@app.post('/city/orders'",
              "@app.get('/city/offers'",
              "@app.post('/city/offers/{order_id}/accept'",
              "@app.get('/city/trips/{trip_id}'",
              "@app.post('/city/trips/{trip_id}/status'",
              "@app.get('/trip/current'",
          ]:
              if forbidden in s:
                  raise SystemExit(f'leftover city route in api/main.py: {forbidden}')

          main_path.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-city-router.yml').unlink()
          PY

      - name: Commit extraction
        run: |
          git config user.name intaxi-recovery-bot
          git config user.email intaxi-recovery-bot@users.noreply.github.com
          git add api/main.py api/routers/city.py .github/workflows/apply-city-router.yml
          git commit -m "Recovery: move city API routes to router"
          git push origin HEAD:recovery/city-router
