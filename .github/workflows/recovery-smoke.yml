name: Recovery smoke checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'recovery/**'

jobs:
  python-bot-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install aiogram fastapi sqlalchemy aiosqlite python-dotenv uvicorn pydantic

      - name: Compile bot and API Python modules
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/intaxi_bot
          BOT_TOKEN: test:test
          APP_ENV: test
        run: |
          python -m compileall api intaxi_bot/app intaxi_bot/main.py

      - name: Import bot entrypoint
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/intaxi_bot
          BOT_TOKEN: 123456:TEST_TOKEN_FOR_IMPORT_ONLY
          APP_ENV: test
        run: |
          python - <<'PY'
          import intaxi_bot.main
          print('import intaxi_bot.main ok')
          PY

      - name: Smoke-test bot main menu routes
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/intaxi_bot
          MINI_APP_URL: https://app.intaxi.best
        run: |
          python - <<'PY'
          from app.keyboards import main_menu

          cases = [
              ('ru', False, '/city/create', 'role=passenger'),
              ('uz', False, '/city/create', 'role=passenger'),
              ('en', True, '/city/offers', 'kind=driver'),
              ('ar', True, '/city/offers', 'kind=driver'),
          ]

          for lang, driver_mode, city_path, city_query in cases:
              kb = main_menu(lang, user_id=None, is_driver_mode=driver_mode)
              city = kb.keyboard[0][0]
              intercity = kb.keyboard[0][1]
              current = kb.keyboard[1][0]
              profile = kb.keyboard[2][0]
              wallet = kb.keyboard[2][1]
              feedback = kb.keyboard[3][0]

              assert city.web_app is not None, (lang, 'city missing web_app')
              assert city_path in city.web_app.url, city.web_app.url
              assert city_query in city.web_app.url, city.web_app.url
              assert intercity.web_app is not None, (lang, 'intercity missing web_app')
              assert '/intercity' in intercity.web_app.url, intercity.web_app.url
              assert current.web_app is not None and '/trip/current' in current.web_app.url, current.web_app.url
              assert profile.web_app is not None and '/profile' in profile.web_app.url, profile.web_app.url
              assert wallet.web_app is not None and '/wallet' in wallet.web_app.url, wallet.web_app.url
              assert feedback.web_app is None, 'Feedback must remain a bot handler button'

          print('bot menu route smoke ok')
          PY

  miniapp-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp_v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mini App dependencies
        run: npm install

      - name: Typecheck Mini App
        run: npm run typecheck

      - name: Build Mini App
        env:
          NEXT_PUBLIC_INTAXI_API_BASE_URL: https://api.intaxi.best
        run: npm run build
