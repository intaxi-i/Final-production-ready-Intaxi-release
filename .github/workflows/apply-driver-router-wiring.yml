name: Apply driver router wiring

on:
  push:
    branches: [recovery/driver-router]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/driver-router
          fetch-depth: 0

      - name: Apply minimal api/main.py wiring patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/main.py')
          s = p.read_text(encoding='utf-8')

          if 'from api.routers import driver as driver_router\n' not in s:
              s = s.replace(
                  'from api.routers import me as me_router\n',
                  'from api.routers import driver as driver_router\nfrom api.routers import me as me_router\n',
              )

          if 'app.include_router(driver_router.router)\n' not in s:
              s = s.replace(
                  'app = FastAPI(title=get_settings().app_name)\napp.include_router(me_router.router)\n',
                  'app = FastAPI(title=get_settings().app_name)\napp.include_router(me_router.router)\napp.include_router(driver_router.router)\n',
              )

          for line in [
              '    DriverLocationUpdateRequest,\n',
              '    DriverOnlineStateResponse,\n',
              '    DriverOnlineUpdateRequest,\n',
          ]:
              s = s.replace(line, '')

          start_marker = "@app.get('/driver/online', response_model=DriverOnlineStateResponse)"
          end_marker = "@app.post('/city/orders', response_model=CityOrderCreateResponse)"
          if start_marker in s:
              start = s.index(start_marker)
              end = s.index(end_marker, start)
              s = s[:start] + s[end:]

          for forbidden in [
              "@app.get('/driver/online'",
              "@app.post('/driver/online'",
              "@app.post('/driver/location'",
              'DriverLocationUpdateRequest,',
              'DriverOnlineStateResponse,',
              'DriverOnlineUpdateRequest,',
          ]:
              if forbidden in s:
                  raise SystemExit(f'leftover in api/main.py: {forbidden}')

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-driver-router-wiring.yml').unlink()
          PY

      - name: Commit wiring result
        run: |
          git config user.name intaxi-recovery-bot
          git config user.email intaxi-recovery-bot@users.noreply.github.com
          git add api/main.py .github/workflows/apply-driver-router-wiring.yml
          git commit -m "Recovery: wire driver router into API"
          git push origin HEAD:recovery/driver-router
